common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/mavros/imu/data_raw"
    time_sync_en: false
    time_offset_lidar_to_imu: -0.036636

preprocess:
    lidar_type: 1
    scan_line: 4
    blind: 0.5
    
is_body_vel: false

mapping:
    acc_cov: 3.0
    gyr_cov: 2.0
    b_acc_cov: 0.0006
    b_gyr_cov: 0.0006
    fov_degree: 360
    det_range: 100.0

    extrinsic_est_en: false

    init_pos: [0.0, 0.0, 0.0]

    extrinsic_T: [0.088426, 0.008641, 0.132288]
    extrinsic_R: [0.824930,  0.026691,  0.564604,
                  0.000104,  0.998877,  -0.047371,
                 -0.565235,  0.039136,  0.824001]
publish:
    path_en: false
    scan_publish_en: true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
