# =====================================================================
# race6_comm / config/ground2/drone_0.yaml
#   ★ 本文件用于【物理 1 号机】，启动时用 drone_id:=0
#
# ⚠️ 这份文件的【功能内容】与 config/race6/drone_0.yaml 完全相同（六个 IP、
#    四条通道、五个对端；只有头部注释不同），所以【任意两台/任意几台飞机都能直接用它】——
#    没开机的对端连不上只是"没有数据"，无害。
#    保留 ground2/ 只是为了兼容早期命令 `config:=.../ground2/drone_0.yaml`。
#
#   ★ 新流程请直接用 race6/（launch 的默认值也已经指向 race6）：
#       bash race6_comm/scripts/race6_launch.sh <物理编号>
#   ★ 改 IP 一律用生成器 —— 它会同时写 race6/ 和 ground2/，不会漏：
#       python3 ~/SixBotsRace/race6_comm/scripts/gen_race6_configs.py --ips <6个IP>
#   ★ 改完必须自检：
#       python3 ~/SixBotsRace/race6_comm/scripts/check_config.py --all
#
# 编号：物理 1 号机 = drone_id 0（软件编号必须从 0 开始，否则六台全不起飞，
#       原因见 config/race6/drone_0.yaml 头部）
# 原理（端口方案、发/收话题为什么必须不同名、里程计不参与避碰）：
#       见 config/race6/drone_0.yaml 头部
# =====================================================================

IP:
  self: '*'
  localhost: '127.0.0.1'
  drone0: '192.168.66.101'           # 物理 1 号机（本机，drone_id:=0）
  drone1: '192.168.66.102'           # 物理 2 号机
  drone2: '192.168.66.103'           # 物理 3 号机
  drone3: '192.168.66.104'           # 物理 4 号机
  drone4: '192.168.66.105'           # 物理 5 号机
  drone5: '192.168.66.106'           # 物理 6 号机

send_topics:
  - topic: /broadcast_traj_from_planner
    message_type: controller_msgs/MinTraj
    max_frequency: 20
    bind_address: self
    port: 4001
    compression: true
  - topic: /mavros/local_position/odom
    message_type: nav_msgs/Odometry
    max_frequency: 20
    bind_address: self
    port: 4101
    compression: false
  - topic: /race6/timesync_tx
    message_type: std_msgs/Float64MultiArray
    max_frequency: 20
    bind_address: self
    port: 4201
    compression: false
  - topic: /race6/comm_test_tx
    message_type: std_msgs/Float64MultiArray
    max_frequency: 20
    bind_address: self
    port: 4401
    compression: false

recv_topics:
  # ---- 1 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone1
    port: 4001
  - topic: /mbn/drone1_odom
    message_type: nav_msgs/Odometry
    connect_address: drone1
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone1
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone1
    port: 4401
  # ---- 2 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone2
    port: 4001
  - topic: /mbn/drone2_odom
    message_type: nav_msgs/Odometry
    connect_address: drone2
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone2
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone2
    port: 4401
  # ---- 3 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone3
    port: 4001
  - topic: /mbn/drone3_odom
    message_type: nav_msgs/Odometry
    connect_address: drone3
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone3
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone3
    port: 4401
  # ---- 4 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone4
    port: 4001
  - topic: /mbn/drone4_odom
    message_type: nav_msgs/Odometry
    connect_address: drone4
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone4
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone4
    port: 4401
  # ---- 5 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone5
    port: 4001
  - topic: /mbn/drone5_odom
    message_type: nav_msgs/Odometry
    connect_address: drone5
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone5
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone5
    port: 4401

advanced:
  compression:
    enable: true
    type: lz4
    level: 6
  thread_pool:
    size: 2
  performance:
    enable_statistics: true
    statistics_interval_ms: 5000
  retry:
    max_retries: -1
    interval_ms: 1000
