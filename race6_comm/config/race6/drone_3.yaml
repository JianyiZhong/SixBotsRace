# =====================================================================
# race6_comm / config/race6/drone_3.yaml
#   ★ 本文件用于【物理 4 号机】，启动时用 drone_id:=3
#
# ★★ 编号：软件 drone_id 必须从 0 开始（物理 1 号机 = drone_id 0）。
#    否则没有任何一台的 id 是 0，六台全都不起飞 —— 原因见 drone_0.yaml 头部
#    （ego_replan_fsm.cpp:173 与 :1306-1320）。
#    映射：物理 1→0 ｜ 2→1 ｜ 3→2 ｜ 4→3（本机）｜ 5→4 ｜ 6→5
#
# 端口方案、发/收话题必须分开的原因、里程计不参与避碰 —— 见 drone_0.yaml。
# 与服务端差异只有「接收列表连谁」：连 0,1,2,4,5（不含自己）。
#   4001 traj ｜ 4101 odom ｜ 4201 timesync ｜ 4401 comm_test
# 【★ 上真机前必须改】IP 段。
# =====================================================================

IP:
  self: '*'
  localhost: '127.0.0.1'
  drone0: '192.168.66.101'           # 物理 1 号机
  drone1: '192.168.66.102'           # 物理 2 号机
  drone2: '192.168.66.103'           # 物理 3 号机
  drone3: '192.168.66.104'           # 物理 4 号机（本机，drone_id:=3）
  drone4: '192.168.66.105'           # 物理 5 号机
  drone5: '192.168.66.106'           # 物理 6 号机

send_topics:
  - topic: /broadcast_traj_from_planner
    message_type: controller_msgs/MinTraj
    max_frequency: 20
    bind_address: self
    port: 4001
    compression: true
  - topic: /mavros/local_position/odom
    message_type: nav_msgs/Odometry
    max_frequency: 20
    bind_address: self
    port: 4101
    compression: false
  - topic: /race6/timesync_tx
    message_type: std_msgs/Float64MultiArray
    max_frequency: 20
    bind_address: self
    port: 4201
    compression: false
  - topic: /race6/comm_test_tx
    message_type: std_msgs/Float64MultiArray
    max_frequency: 20
    bind_address: self
    port: 4401
    compression: false

recv_topics:
  # ---- 0 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone0
    port: 4001
  - topic: /mbn/drone0_odom
    message_type: nav_msgs/Odometry
    connect_address: drone0
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone0
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone0
    port: 4401
  # ---- 1 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone1
    port: 4001
  - topic: /mbn/drone1_odom
    message_type: nav_msgs/Odometry
    connect_address: drone1
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone1
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone1
    port: 4401
  # ---- 2 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone2
    port: 4001
  - topic: /mbn/drone2_odom
    message_type: nav_msgs/Odometry
    connect_address: drone2
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone2
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone2
    port: 4401
  # ---- 4 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone4
    port: 4001
  - topic: /mbn/drone4_odom
    message_type: nav_msgs/Odometry
    connect_address: drone4
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone4
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone4
    port: 4401
  # ---- 5 号机 ----
  - topic: /broadcast_traj_to_planner
    message_type: controller_msgs/MinTraj
    connect_address: drone5
    port: 4001
  - topic: /mbn/drone5_odom
    message_type: nav_msgs/Odometry
    connect_address: drone5
    port: 4101
  - topic: /race6/timesync_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone5
    port: 4201
  - topic: /race6/comm_test_rx
    message_type: std_msgs/Float64MultiArray
    connect_address: drone5
    port: 4401

advanced:
  compression:
    enable: true
    type: lz4
    level: 6
  thread_pool:
    size: 2
  performance:
    enable_statistics: true
    statistics_interval_ms: 5000
  retry:
    max_retries: -1
    interval_ms: 1000
